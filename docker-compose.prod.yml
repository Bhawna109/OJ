# BhawnaOJ production stack for EC2 — pulls pre-built images from Docker Hub.
#
# Deploy:  docker compose -f docker-compose.prod.yml pull
#          docker compose -f docker-compose.prod.yml up -d
# (on EC2 this file is saved as /home/ec2-user/docker-compose.yml, so plain
#  `docker compose pull && docker compose up -d` works)
#
# Expects the backend secrets at /home/ec2-user/.env
# compiler + redis have NO host ports — only backend/worker reach them over
# the private Docker network.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  compiler:
    image: bhawnapatel25/algou-compiler:latest
    restart: unless-stopped

  backend:
    image: bhawnapatel25/algou-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - /home/ec2-user/.env
    environment:
      - COMPILER_URL=http://compiler:7000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - compiler
      - redis

  worker:
    image: bhawnapatel25/algou-backend:latest
    restart: unless-stopped
    command: node worker.js
    env_file:
      - /home/ec2-user/.env
    environment:
      - COMPILER_URL=http://compiler:7000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - compiler
      - redis
