# BhawnaOJ production stack for EC2 — pulls pre-built images from Docker Hub.
#
# Deploy:  docker compose -f docker-compose.prod.yml pull
#          docker compose -f docker-compose.prod.yml up -d
#
# Expects the backend secrets at /home/ec2-user/.env
# The compiler service has NO host ports — only the backend can reach it
# over the private Docker network at http://compiler:7000.
services:
  compiler:
    image: bhawnapatel25/algou-compiler:latest
    restart: unless-stopped

  backend:
    image: bhawnapatel25/algou-backend:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - /home/ec2-user/.env
    environment:
      - COMPILER_URL=http://compiler:7000
    depends_on:
      - compiler
